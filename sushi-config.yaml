  - url: https://www.nwgenomics.nhs.uk/contact-us
license: CC-BY-4.0
fhirVersion: 4.0.1
jurisdiction: urn:iso:std:iso:3166#GB "United Kingdom of Great Britain and Northern Ireland"
copyrightYear: 2026+

dependencies:
